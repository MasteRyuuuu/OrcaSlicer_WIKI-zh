<style>
/* Layout: sticky top bar; left section tree, centre article (~46rem), right "on this page" list on wide screens.

:root {

  --panel-2: #edf3f1;

  --fg-2: #384a47;

  --note: #2463c7; --tip: #17804a; --important: #7650cf; --warning: #9f5f00; --caution: #c2372c;
  --tk-k: #8239d6; --tk-s: #18794e; --tk-c: #6f7d7a; --tk-n: #b25500; --tk-f: #0b5aa8; --tk-v: #9a3412;

  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
  --top: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1312; --panel: #121a19; --panel-2: #192322; --fg: #e1eae8; --fg-2: #c0cdca; --muted: #8ea29d;
    --line: #253230; --accent: #39c1af; --accent-ink: #62d4c4; --accent-soft: #12332e; --code-bg: #162020;
    --mark: #6d5b10; --shadow: 0 14px 36px rgba(0, 0, 0, .55);
    --note: #72a9ff; --tip: #4fc58d; --important: #b49bff; --warning: #e2a646; --caution: #ff8073;
    --tk-k: #c7a0ff; --tk-s: #82e0aa; --tk-c: #8a9996; --tk-n: #f3b56f; --tk-f: #7ab7ff; --tk-v: #f0a07a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1312; --panel: #121a19; --panel-2: #192322; --fg: #e1eae8; --fg-2: #c0cdca; --muted: #8ea29d;
  --line: #253230; --accent: #39c1af; --accent-ink: #62d4c4; --accent-soft: #12332e; --code-bg: #162020;

* { box-sizing: border-box; }

  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  border-radius: 3px; padding: 0 3px; vertical-align: 1px; font-weight: 400; }
.grp-btn { all: unset; box-sizing: border-box; display: flex; width: 100%; align-items: center; justify-content: space-between;

<script type="application/json" id="wiki-data">/*__DATA__*/</script>
<script>
(function () {
  'use strict';
  const D = JSON.parse(document.getElementById('wiki-data').textContent);
  const byId = new Map(D.pages.map(p => [p.id, p]));
  const order = D.pages.map(p => p.id);
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const GH = 'https://github.com/OrcaSlicer/OrcaSlicer/wiki/';
  const navLinks = new Map();
  const groupOf = new Map();

  /* ---------- sidebar ---------- */
  function buildNav() {
    const root = document.createElement('ul');
    function make(item, parents) {
      const li = document.createElement('li');
      if (item.p) {
        const p = byId.get(item.p);
        if (!p) return null;
        const a = document.createElement('a');
        a.href = '#' + p.id;
        a.textContent = p.id === 'home' ? '首页' : p.t;
        if (!p.zh) { a.classList.add('en-only'); a.title = '尚未翻译，显示英文原文'; }
        navLinks.set(p.id, a);
        groupOf.set(p.id, parents);
        li.appendChild(a);
      } else {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'grp-btn';
        btn.textContent = item.t;
        btn.setAttribute('aria-expanded', 'false');
        btn.addEventListener('click', () => btn.setAttribute('aria-expanded', btn.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'));
        const ul = document.createElement('ul');
        item.c.forEach(ch => { const n = make(ch, parents.concat(btn)); if (n) ul.appendChild(n); });
        li.append(btn, ul);
      }
      return li;
    }
    D.nav.forEach(it => { const n = make(it, []); if (n) root.appendChild(n); });
    $('#nav').appendChild(root);
    const pct = Math.round(100 * D.done / D.total);
    $('#side-foot').innerHTML = `已翻译 ${D.done} / ${D.total} 页<div class="progress"><i style="width:${pct}%"></i></div>` +
      `译自 OrcaSlicer 官方 Wiki，原文版本 <a href="https://github.com/OrcaSlicer/OrcaSlicer_WIKI/commit/${esc(D.commit)}" target="_blank" rel="noopener">${esc(D.commit)}</a>（${esc(D.date)}）。`;
  }

  /* ---------- page ---------- */
  function hydrate(root) {
    root.querySelectorAll('img[data-src]').forEach(img => { const k = img.dataset.src; img.src = D.inline[k] || k; img.removeAttribute('data-src'); });
    root.querySelectorAll('div.highlight[data-copy]').forEach(box => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'copy-btn'; b.textContent = '复制';
      b.addEventListener('click', () => {
        const code = box.querySelector('pre').innerText;
        const done = () => { b.textContent = '已复制'; setTimeout(() => (b.textContent = '复制'), 1400); };
        const fallback = () => { const r = document.createRange(); r.selectNodeContents(box.querySelector('pre')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = '已选中，请手动复制'; };
        try { navigator.clipboard.writeText(code).then(done, fallback); } catch (e) { fallback(); }
      });
      box.appendChild(b);
    });
  }

  let spy = null;
  function buildToc(p) {
    const box = $('#pagetoc');
    const items = p.toc.filter(t => t[0] === 2 || t[0] === 3);
    if (items.length < 2) { box.innerHTML = ''; return; }
    box.innerHTML = '<h2>本页目录</h2><ul>' + items.map(t =>
      `<li><a class="l${t[0]}" href="#${t[1]}" data-for="${t[1]}">${esc(t[2])}</a></li>`).join('') + '</ul>';
    if (spy) spy.disconnect();
    if (!('IntersectionObserver' in window)) return;
    const links = new Map([...box.querySelectorAll('a')].map(a => [a.dataset.for, a]));
    spy = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          box.querySelectorAll('a.on').forEach(a => a.classList.remove('on'));
          const a = links.get(e.target.id);
          if (a) a.classList.add('on');
        }
      });
    }, { rootMargin: '-70px 0px -70% 0px' });
    items.forEach(t => { const el = document.getElementById(t[1]); if (el) spy.observe(el); });
  }

  function render(p) {
    const i = order.indexOf(p.id);
    const prev = i > 0 ? byId.get(order[i - 1]) : null;
    const next = i < order.length - 1 ? byId.get(order[i + 1]) : null;
    const crumbs = p.sec.length ? `<div class="crumbs">${p.sec.map(s => `<span>${esc(s)}</span>`).join('')}</div>` : '';
    const origUrl = GH + p.key;
    const bar = `<div class="pagebar"><a href="${origUrl}" target="_blank" rel="noopener">英文原文 ↗</a></div>`;
    const banner = p.zh ? '' : `<div class="banner">本页尚未翻译，下面暂时显示英文原文。</div>`;
    const pn = (prev || next) ? `<nav class="pn" aria-label="翻页">${prev ? `<a class="prev" href="#${prev.id}"><small>上一页</small><span>${esc(prev.t)}</span></a>` : ''}` +
      `${next ? `<a class="next" href="#${next.id}"><small>下一页</small><span>${esc(next.t)}</span></a>` : ''}</nav>` : '';
    const foot = `<footer class="foot">本站是 <a href="https://www.orcaslicer.com/wiki/" target="_blank" rel="noopener">OrcaSlicer 官方 Wiki</a> 的非官方中文译本，设置项名称尽量采用 OrcaSlicer 简体中文界面的官方译名，标题旁的灰色文字为英文原名。` +
      `原文版权归 OrcaSlicer 项目及其贡献者所有；内容以英文原文为准。</footer>`;
    const main = $('#content');
    main.innerHTML = crumbs + bar + banner + `<article class="doc" id="doc">${p.h}</article>` + pn + foot;
    hydrate(main);
    buildToc(p);
    navLinks.forEach(a => a.classList.remove('active'));
    const a = navLinks.get(p.id);
    if (a) {
      a.classList.add('active');
      (groupOf.get(p.id) || []).forEach(b => b.setAttribute('aria-expanded', 'true'));
      const sb = $('#sidebar');
      const r = a.getBoundingClientRect(), s = sb.getBoundingClientRect();
      if (r.top < s.top + 40 || r.bottom > s.bottom - 40) sb.scrollTop += r.top - s.top - s.height / 3;
    }
    document.title = (p.id === 'home' ? '' : p.t + ' · ') + 'OrcaSlicer 中文 Wiki';
  }

  /* ---------- routing ---------- */
  let current = null, pendingHit = null;
  function parse() {
    let h = location.hash.slice(1);
    try { h = decodeURIComponent(h); } catch (e) { }
    if (!h) return { id: 'home' };
    const k = h.indexOf('--');
    const id = k < 0 ? h : h.slice(0, k);
    if (byId.has(id)) return { id, anchor: k < 0 ? null : h };
    return { id: 'home' };
  }
  function route() {
    const r = parse();
    const changed = r.id !== current;
    if (changed) { render(byId.get(r.id)); current = r.id; }
    closeNav();
    requestAnimationFrame(() => {
      const el = r.anchor && document.getElementById(r.anchor);
      if (el) el.scrollIntoView();
      else if (changed) window.scrollTo(0, 0);
      if (pendingHit) { highlight(pendingHit, !el); pendingHit = null; }
    });
  }
  window.addEventListener('hashchange', route);

  function highlight(term, scroll) {
    const doc = $('#doc');
    if (!doc || !term) return;
    const tl = term.toLowerCase();
    const w = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = w.nextNode())) {
      const at = n.nodeValue.toLowerCase().indexOf(tl);
      if (at < 0 || n.parentElement.closest('.h-link')) continue;
      const r = document.createRange();
      r.setStart(n, at); r.setEnd(n, at + term.length);
      const m = document.createElement('mark');
      m.className = 'hit';
      try { r.surroundContents(m); } catch (e) { return; }
      if (scroll) m.scrollIntoView({ block: 'center' });
      setTimeout(() => m.classList.add('fade'), 1800);
      return;
    }
  }

  /* ---------- mobile drawer ---------- */
  function closeNav() { document.body.classList.remove('nav-open'); $('#menu-btn').setAttribute('aria-expanded', 'false'); }
  $('#menu-btn').addEventListener('click', () => {
    const open = !document.body.classList.contains('nav-open');
    document.body.classList.toggle('nav-open', open);
    $('#menu-btn').setAttribute('aria-expanded', String(open));
  });
  $('#scrim').addEventListener('click', closeNav);

  /* ---------- search ---------- */
  const IDX = D.pages.map(p => ({ p, t: (p.t + ' ' + p.te).toLowerCase(), hs: p.toc.map(h => (h[2] + ' ' + h[3]).toLowerCase()), x: p.x, xl: p.x.toLowerCase() }));
  const q = $('#q'), res = $('#results');
  let hits = [], sel = -1;
  function count(hay, needle) { let c = 0, i = 0; while ((i = hay.indexOf(needle, i)) >= 0 && c < 50) { c++; i += needle.length; } return c; }
  function snippet(it, terms) {
    const i = it.xl.indexOf(terms[0]);
    if (i < 0) return '';
    const a = Math.max(0, i - 36), b = Math.min(it.x.length, i + terms[0].length + 64);
    let s = esc((a ? '…' : '') + it.x.slice(a, b) + (b < it.x.length ? '…' : ''));
    terms.forEach(t => { if (t.length) s = s.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`); });
    return s;
  }
  function search(str) {
    const terms = str.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    const out = [];
    for (const it of IDX) {
      let score = 0, ok = true, head = null;
      for (const t of terms) {
        const inT = it.t.includes(t);
        const hi = it.hs.findIndex(h => h.includes(t));
        const c = count(it.xl, t);
        if (!inT && hi < 0 && !c) { ok = false; break; }
        score += (inT ? 120 : 0) + (hi >= 0 ? 30 : 0) + Math.min(c, 12);
        if (hi >= 0 && head === null) head = it.p.toc[hi];
      }
      if (ok) out.push({ it, score, head });
    }
    return out.sort((a, b) => b.score - a.score).slice(0, 40).map(r => ({ ...r, terms }));
  }
  function showResults() {
    const str = q.value.trim();
    if (!str) { res.hidden = true; return; }
    hits = search(str);
    sel = hits.length ? 0 : -1;
    if (!hits.length) { res.innerHTML = `<div class="r-empty">没有找到"${esc(str)}"。可以试试英文名或更短的关键词。</div>`; res.hidden = false; return; }
    res.innerHTML = `<div class="r-count">${hits.length >= 40 ? '前 40 条' : hits.length + ' 条'}结果</div>` + hits.map((h, k) => {
      const p = h.it.p;
      const href = '#' + (h.head ? h.head[1] : p.id);
      const where = [...p.sec, h.head ? h.head[2] : null].filter(Boolean).join(' / ');
      return `<a class="result${k === 0 ? ' sel' : ''}" href="${href}" data-k="${k}"><div class="r-t">${esc(p.t)}${p.te && p.te !== p.t ? `<span class="r-en">${esc(p.te)}</span>` : ''}</div>` +
        `${where ? `<div class="r-p">${esc(where)}</div>` : ''}<div class="r-s">${snippet(h.it, h.terms)}</div></a>`;
    }).join('');
    res.hidden = false;
  }
  function choose(k) {
    const h = hits[k];
    if (!h) return;
    pendingHit = h.head ? null : h.terms[0];
    res.hidden = true;
    q.blur();
    const target = '#' + (h.head ? h.head[1] : h.it.p.id);
    if (location.hash === target) route(); else location.hash = target;
  }
  let timer = null;
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(showResults, 90); });
  q.addEventListener('focus', () => { if (q.value.trim()) showResults(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!hits.length) return;
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
      res.querySelectorAll('.result').forEach((el, k) => el.classList.toggle('sel', k === sel));
      const el = res.querySelector('.result.sel'); if (el) el.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') { e.preventDefault(); choose(Math.max(sel, 0)); }
    else if (e.key === 'Escape') { res.hidden = true; q.blur(); }
  });
  res.addEventListener('click', e => { const a = e.target.closest('.result'); if (a) { e.preventDefault(); choose(+a.dataset.k); } });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); q.select(); }
  });

  buildNav();
  route();
})();
</script>
